name: HighLevel post queue

on:
  push:
    branches: [main]
    paths: ["tools/queue/*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hl-create
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Create queued posts in HighLevel
        env:
          HL_TOKEN: ${{ secrets.HL_TOKEN }}
        run: python tools/hl_create.py
      - name: Host any TikTok videos in HighLevel
        env:
          HL_TOKEN: ${{ secrets.HL_TOKEN }}
        run: python tools/tiktok_sync.py || true
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/queue
          git commit -m "HighLevel queue results" || exit 0
          git pull --rebase origin main && git push
