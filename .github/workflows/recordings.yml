name: Video recordings

# Every two hours: transcribe new footage uploaded to HighLevel Media Storage > "Video recordings"
# (daily-social/clips/sources.json + transcripts) for the video-clips scheduled task.
on:
  schedule:
    - cron: "5 13-23/2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recordings
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q requests numpy pillow faster-whisper
      - name: Transcribe new recordings
        env:
          HL_TOKEN: ${{ secrets.HL_TOKEN }}
          LM_WHISPER: small.en
        run: python3 tools/recordings_sync.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily-social/clips || true
          git commit -qm "New recording transcripts" || exit 0
          git pull -q --rebase origin main && git push -q
